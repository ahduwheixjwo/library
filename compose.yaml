
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      SESSION_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: library
      DB_USERNAME: laravel
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-localpassword}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: laravel
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-localpassword}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-localrootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" || exit 1'
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
